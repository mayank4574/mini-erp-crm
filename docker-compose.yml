version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mini_erp_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  server:
    build: ./server
    container_name: mini_erp_server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/mini-erp-crm
      - JWT_SECRET=your_jwt_secret_key_here
      - PORT=5000
      - AI_API_KEY=${AI_API_KEY}
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build: ./client
    container_name: mini_erp_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
